[package]
name = "curvyo-library-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The per-user machine records of every family (ADR 0097 §4: envelope, kind, merge, connection) and the Curvyo online library protocols (ADR 0085): the sources file, the Git catalogue index, the Iconify requests and answers, and the hash check, as pure request and response functions (wasm-compatible)."

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# The text of `online-sources.toml` (ADR 0085 decision 1); the workspace's version.
toml.workspace = true
# The SHA-256 of a template file against its catalogue entry (ADR 0085 decision 4).
sha2.workspace = true
# Inflates the shipped keyword file (spec `0153`, ADR 0087 decision 7); already in both builds
# through `zip`, now direct.
flate2.workspace = true
