[package]
name = "curvyo-geometry-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Curvyo geometry kernel: cubic Bézier geometry, boolean operations, stroke and variable-width outlines, Spiro and B-spline curves (pure, wasm-compatible)."

[lints]
workspace = true

[dependencies]
curvyo-document-core = { path = "../curvyo-document-core", version = "0.1.0" }
kurbo.workspace = true
i_overlay.workspace = true
# Bit-identical `sin`/`cos` for the pattern generators on every platform and in wasm (ADR 0029 §5;
# `f64::sin` calls the platform's libm). MIT OR Apache-2.0, rust-lang, pure Rust; already in
# `Cargo.lock` through the workspace's dependencies.
libm = { version = "0.2.16", default-features = false }
thiserror.workspace = true
# Safe Rust port of Levien’s Spiro reference, Apache-2.0; see ADR 0053.
spiro-inner = { version = "0.1.0", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Not built for wasm32 (it needs OS facilities there; the wasm build runs the golden test only).
# Test-only (tester-added, `specs/0002-path-node-editing` verification): property
# tests for the geometry kernel's flatten/nearest-point/subdivide invariants
# (`CLAUDE.md`'s tester role, "Geometry ... property tests with proptest").
proptest.workspace = true

# `tests/stroke_to_path_golden.rs` times its budgets by the thread's CPU time, so a busy CI
# runner does not fail them (`specs/0085-stroke-to-path` criterion 29). Already in the lock file
# through `curvyo-editor-wasm`'s tests; MIT OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", features = ["time"] }

# The golden results are also compared in the wasm build, in Node, by `wasm-bindgen-test-runner`
# (`tests/boolean_golden_wasm.rs`, criterion 43 of `specs/0016-boolean-operations`). Same
# release train as the `wasm-bindgen` crate the facade uses; MIT OR Apache-2.0.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
