[package]
name = "curvyo-laser-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The laser workbench extension (ADR 0034): its manifest, fixture outlines, notices and machine profiles."

[lints]
workspace = true

# The adjustment goldens are also compared in the wasm build, in Node, by
# `wasm-bindgen-test-runner` (`tests/adjust_goldens.rs`, ADR 0073 §1). The version
# `curvyo-geometry-core` already uses; MIT OR Apache-2.0.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dependencies]
curvyo-extension-core = { path = "../curvyo-extension-core", version = "0.1.0" }
curvyo-document-core = { path = "../curvyo-document-core", version = "0.1.0" }
curvyo-geometry-core = { path = "../curvyo-geometry-core", version = "0.1.0" }
# The record envelope, `kind`, merge and connection shared by every machine family (ADR 0097 §4).
curvyo-library-core = { path = "../curvyo-library-core", version = "0.1.0" }
# The decoded working image of a raster item (ADR 0068 §1); pure, builds for wasm32.
curvyo-image-core = { path = "../curvyo-image-core", version = "0.1.0" }
# `pow` for the 256 entries of the gamma table (ADR 0068 §4): the same bits on every target.
libm.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
