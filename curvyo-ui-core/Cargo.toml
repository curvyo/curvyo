[package]
name = "curvyo-ui-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Curvyo interaction layer: pen/node tool state machines, hit-testing, selection and command dispatch (pure, wasm-compatible)."

[lints]
workspace = true

[dependencies]
curvyo-document-core = { path = "../curvyo-document-core", version = "0.1.0" }
curvyo-geometry-core = { path = "../curvyo-geometry-core", version = "0.1.0" }
curvyo-text-core = { path = "../curvyo-text-core", version = "0.1.0" }
# The SVG reader whose drawing `svg_import` maps to the document (ADR 0018 §2).
curvyo-svg-core = { path = "../curvyo-svg-core", version = "0.1.0" }
# The bitmap decoder boundary of the image import (ADR 0017 §4).
curvyo-image-core = { path = "../curvyo-image-core", version = "0.1.0" }
kurbo.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
# Test-only (tester-added, `specs/0005-object-transform` verification): property
# tests for the resize/rotate drag arithmetic (`CLAUDE.md`'s tester role,
# "Geometry ... property tests with proptest"). Same crate and version
# `curvyo-geometry-core` already uses.
proptest.workspace = true
serde_json.workspace = true
# `tests/svg_text_budget.rs` encodes the 12-megapixel JPEG of `specs/0024-svg-import-export`
# criterion 108 in memory; the workspace's own pinned `image`.
image.workspace = true
