[package]
name = "curvyo-image-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Curvyo bitmap decoder boundary: PNG, JPEG and WebP by content, header checks before any pixel buffer, a deterministic working image (pure, wasm-compatible)."

[lints]
workspace = true

[dependencies]
image.workspace = true
# `pow` and `exp` for the 256-entry Levels and range tables (ADR 0073 §1, §4): the same bits on
# every target.
libm.workspace = true
# The input hash of an AI step's stored result (ADR 0077 §2); the workspace pin, already locked.
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Mutation smoke over the fixtures (`specs/0058-bitmap-import` "Fixtures", the fuzz plan item).
proptest.workspace = true

# The adjustment goldens are also compared in the wasm build, in Node, by
# `wasm-bindgen-test-runner` (`tests/adjust_goldens.rs`, ADR 0073 §1). The version
# `curvyo-geometry-core` already uses; MIT OR Apache-2.0.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
