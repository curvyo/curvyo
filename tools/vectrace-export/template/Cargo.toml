[package]
name = "vectrace"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "A raster tracer and text reader: an RGBA8 raster and trace settings in, closed outlines in millimetres out (pure, wasm-compatible)."
readme = "README.md"
keywords = ["trace", "vectorize", "ocr", "svg", "wasm"]
categories = ["graphics", "multimedia::images", "wasm"]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"

[dependencies]
kurbo = { version = "0.13", default-features = false, features = ["std"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
rten = { version = "=0.26.0", default-features = false, features = ["onnx_format"] }
rten-tensor = { version = "=0.26.0", default-features = false }
sha2 = { version = "0.10", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", features = ["time"] }

[dev-dependencies]
toml = { version = "1.1", default-features = false, features = ["std", "parse", "display", "serde"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
cap = { version = "0.1.2", features = ["stats"] }

[workspace]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.sha2]
opt-level = 3

# The text reader runs the reference set in the ordinary test run; unoptimised it takes minutes.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.vectrace]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
