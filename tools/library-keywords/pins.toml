# The pinned upstream files of the search keywords (spec 0153 criterion 6, ADR 0087 decision 1).
# Raising a version: fetch the new tarball (README.md), edit `version` and both SHA-256 here,
# re-run generate.py, and quote its printed counts and size in a `chore/` PR.
# `file` and `licence_file` are relative to the upstream folder given to generate.py.

[[source]]
prefix = "lucide"
project = "Lucide"
package = "lucide-static"
version = "1.80.0"
reader = "lucide"
file = "lucide-static/tags.json"
sha256 = "dd90d3217798ba2ad50f75d5c4bad9f195ac65a64468ef13aeab7a3591e7485b"
licence = "ISC"
url = "https://lucide.dev"
licence_file = "lucide-static/LICENSE"
licence_sha256 = "b495047bd93a9b06913511076f504daba17d5bbeb3e0650f3bb53a4220329c57"

