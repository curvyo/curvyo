# Licence record of a shipped font family (ADR 0020 §4). The files are the upstream release,
# unmodified. Checked by `curvyo-text-core/tests/included_fonts.rs`.
family = "Source Serif 4"
licence = "OFL-1.1"
licence_file = "LICENSE.md"
source_url = "https://github.com/adobe-fonts/source-serif/releases/tag/4.005R"
tags = ["serif"]
version = "4.005"

[[faces]]
file = "SourceSerif4-Regular.ttf"
style = "Regular"

[[faces]]
file = "SourceSerif4-It.ttf"
style = "Italic"

[[faces]]
file = "SourceSerif4-Bold.ttf"
style = "Bold"

[[faces]]
file = "SourceSerif4-BoldIt.ttf"
style = "Bold Italic"
