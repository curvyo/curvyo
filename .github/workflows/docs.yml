# The pipeline of a documentation-only pull request: specs, ADRs and Markdown under docs/ and
# specs/. The code gate (ci.yml) and the wasm size record (wasm-size.yml) skip such pull requests
# with `paths-ignore`; a pull request that changes anything else still runs them as well.
# scripts/check_docs.py: unique spec and ADR numbers, every ADR file in the ADR index, and
# relative Markdown links that resolve.
name: docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "specs/**"
      - "**/*.md"
      - "scripts/check_docs.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check numbers, the ADR index and links
        run: python3 -I scripts/check_docs.py
