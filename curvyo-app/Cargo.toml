[package]
name = "curvyo-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Tauri 2 desktop host: native file dialogs, the .curvyo file association, the window title and close, the macOS menu, and platform I/O behind a narrow command interface (ADR 0001 §6, ADR 0011 §2)."

[lints]
workspace = true

[features]
# Standard Tauri 2 scaffold block: without this, a release binary falls
# back to connecting to the Vite dev server (tauri.conf.json's `devUrl`)
# instead of serving the bundled frontend, which breaks AC1 (empty canvas
# never appears) and would break AC8/AC9 the moment no dev server is
# reachable, which is every real user's machine.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", default-features = false, features = ["config-json"] }

[dependencies]
tauri = { version = "2", default-features = false, features = [
    "common-controls-v6",
    "compression",
    "dbus",
    "dynamic-acl",
    "tauri-runtime-wry",
    "webkit2gtk",
    "webview2-com",
    "wry",
    "x11",
] }
tauri-plugin-dialog = "2"
# Opens a font folder's PDF in the system viewer (`specs/0083-font-info-and-zip` adrs.md decision 7,
# plan note 2026-10-26): MIT, the crate `tauri-plugin-opener` itself calls for `open_path`, without
# the plugin's D-Bus stack (`zbus`, flagged unmaintained by `cargo deny`). Default features only:
# `shellexecute-on-windows` would pull `dunce` (customer, 2026-10-26). On Windows `open` 5.4 runs PowerShell `Invoke-Item
# -LiteralPath` (path in an env var), then `explorer.exe`; `cmd` only with its `insecure` feature.
open = "5"
# A fresh Loro peer id per open session (specs/0001-project-file-foundation/
# adrs.md, amended 2026-10-03) is minted by the frontend itself now
# (`frontend/src/lib/editorSession.ts`'s `mintPeerId`, the browser's own
# CSPRNG) — `path-node-editing`'s PR review moved Open/Save so the only
# document any session touches is the frontend's own `WasmSession`; this
# host no longer builds a `curvyo_document_core::Document` at all, so it
# has no peer id of its own left to mint.
serde.workspace = true
serde_json.workspace = true
curvyo-storage-io = { path = "../curvyo-storage-io", version = "0.1.0" }

# The import's file limit, checked before a pasted or dropped local file is read
# (`specs/0087-image-clipboard-and-drop` criterion 6); on Linux the import dialog's preview also
# decodes through its bounded decoder and ceilings (adrs.md decision 6), never through gdk-pixbuf.
curvyo-image-core = { path = "../curvyo-image-core", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
# An SVG's preview reads the file through the importer of Import SVG and its hostile-input limits
# (`specs/0024-svg-import-export`, no second SVG parser) and draws it with `kurbo`'s stroker and our
# own small fill (`src/raster.rs`); no new crate, no gdk-pixbuf or librsvg decoding.
curvyo-svg-core = { path = "../curvyo-svg-core", version = "0.1.0" }
# Its texts are matched and laid out as Import SVG does it (`curvyo-ui-core`'s font matching and
# text conversion, `curvyo-text-core`'s engine; `FontKind` of `curvyo-document-core`), with the
# fonts the page lists, read through `curvyo-storage-io`; no new crate.
curvyo-document-core = { path = "../curvyo-document-core", version = "0.1.0" }
curvyo-text-core = { path = "../curvyo-text-core", version = "0.1.0" }
curvyo-ui-core = { path = "../curvyo-ui-core", version = "0.1.0" }
kurbo.workspace = true
# The Import button's GTK3 file chooser with our preview pane (`specs/0087-image-clipboard-and-drop`
# adrs.md decision 6): MIT, already in the tree under Tauri at this version, safe API only.
gtk = "0.18"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# PNG fixtures for the preview tests; already the decoder of `curvyo-image-core`.
image.workspace = true
