[package]
name = "vectrace"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "The Curvyo raster tracer and text reader: an RGBA8 raster and trace settings in, closed outlines in document millimetres out (pure, wasm-compatible)."

[lints]
workspace = true

[dependencies]
kurbo.workspace = true
thiserror.workspace = true
# The text reader (ADR 0028 §1, the module `vectrace::ocr`): pinned exactly, the same as before the move.
rten = { version = "=0.26.0", default-features = false, features = ["onnx_format"] }
rten-tensor = { version = "=0.26.0", default-features = false }
sha2.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# The CPU-time budget of criterion 25 reads the thread's CPU clock (`CLAUDE.md` §5).
rustix = { version = "1.1", features = ["time"] }

[dev-dependencies]
# The record test of the OCR module reads `model.toml` (ADR 0028 §5).
toml.workspace = true
serde.workspace = true
# The golden files of `tests/fixtures/trace/` (criterion 18).
serde_json.workspace = true
# The reference set's CC0 and local images are PNG and JPEG (`specs/0089` adrs.md §11, dev only);
# the same pin and decoders as `curvyo-image-core`, see `tests/common/decode.rs`.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
# The counting global allocator of the memory test (criterion 26), dev only: MIT OR Apache-2.0,
# no dependencies, keeps the `unsafe` of an allocator out of our code.
cap = { version = "0.1.2", features = ["stats"] }
