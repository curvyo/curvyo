<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>03 · Laser page grey and the import notice</title><style>:root{--canvas-bg:#E8E8EB;--pasteboard-bg:#B8B8BE;--toolbar-bg:#DCDCE0;--panel-bg:#DCDCE0;--toolbar-icon:#3A3A3F;

body{margin:0;background:#FFFFFF;color:var(--toolbar-icon);font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px}

/* properties panel: strip + body */
.pwrap{display:flex;align-items:stretch;border-radius:2px;overflow:hidden;flex:none}
