[package]
name = "curvyo-document-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Curvyo document model: units, the document root record, and the .curvyo project container (pure, wasm-compatible)."

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
zip.workspace = true
loro.workspace = true
# The asset hash of embedded images (ADR 0017 §2): SHA-256, already in the lock file.
sha2.workspace = true

# `tests/acceptance_0016_pr2_tester.rs` times the rotate commit by the thread's CPU time, so a
# busy test run does not distort the ratio it asserts.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", features = ["time"] }
