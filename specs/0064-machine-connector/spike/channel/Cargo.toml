[package]
name = "spike-0064-channel"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Default features off: no `use-getrandom`, no AES-GCM/SHA-256/ring. `std` off too.
snow = { version = "=0.10.0", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-blake2"] }
# Default feature is `getrandom`; off, only the *_with_rng constructors remain.
spake2 = { version = "=0.4.0", default-features = false }
# rand_core 0.6 line, the one spake2 0.4 takes; default features off so no getrandom.
rand_chacha = { version = "=0.3.1", default-features = false }
rand_core = { version = "0.6", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
# Size baseline: the wasm export does nothing, so the difference is snow + spake2 + rand_chacha.
baseline = []
