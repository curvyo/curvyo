[package]
name = "curvyo-editor-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Thin wasm-bindgen facade binding curvyo-document-core, curvyo-ui-core and curvyo-render-core, owning the wgpu device/surface and GPU submission (ADR 0001 §3)."

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
curvyo-document-core = { path = "../curvyo-document-core", version = "0.1.0" }
curvyo-ui-core = { path = "../curvyo-ui-core", version = "0.1.0" }
curvyo-render-core = { path = "../curvyo-render-core", version = "0.1.0" }
# The History tab's rows cross the wasm boundary as one JSON text (ADR 0001 §5: strings and scalars).
serde_json.workspace = true

[dev-dependencies]
# `tests/acceptance_0005.rs` counts Loro changes / reads op keys to verify
# "one interaction = one commit" and the per-register write table.
loro.workspace = true

zip.workspace = true

# `tests/node_marquee_interactivity.rs` times the marquee frame by the thread's CPU time, so a
# busy CI runner does not fail the 16.7 ms budget (`specs/0053-node-marquee-selection/` crit. 25).
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", features = ["time"] }

# `session.rs` (this crate's actual orchestration logic) is plain Rust,
# host-independent and tested by ordinary `cargo test`. Everything below
# is wasm32-only: the `wasm-bindgen` surface and the `wgpu` device/
# surface/GPU submission it owns (ADR 0001 §3) are both meaningless on
# the host and would need a browser or a GPU driver to even construct.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
wgpu = { version = "30", default-features = false, features = ["webgl", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement"]
