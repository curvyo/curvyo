[workspace]
resolver = "2"
members = [
    "curvyo-document-core",
    "curvyo-geometry-core",
    "curvyo-text-core",
    "curvyo-ui-core",
    "curvyo-render-core",
    "curvyo-editor-wasm",
    "curvyo-storage-io",
    "curvyo-app",
]

[workspace.package]
# The application version: the File tab shows it and every saved file records it
# (`specs/0051-sidebar-and-no-menu`, criterion 42). `curvyo-app` and `curvyo-editor-wasm` take it.
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
thiserror = { version = "2", default-features = false, features = ["std"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# The built-in document formats (`curvyo-document-core/data/document-presets.toml`) are parsed; the
# maker's formats file (`document-formats.toml`, specs/0045-document-formats-library) is read and
# written, which needs `display` (the `toml_writer` crate, pure Rust, builds for wasm32).
toml = { version = "1.1", default-features = false, features = ["std", "parse", "display", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
# Pinned exactly: undo of Delete revives a node through an injected tree move that the handler API
# forbids (ADR 0014 §11). A Loro upgrade is taken only with `tests/loro_revival_canary.rs` green.
loro = { version = "=1.16.2", default-features = false }
kurbo = { version = "0.13", default-features = false, features = ["std"] }
lyon = "1"
# Pinned exactly: a polygon boolean engine whose rare defects would ruin a workpiece, so every
# update is a reviewed PR that reruns the boolean fixtures and property tests
# (specs/0016-boolean-operations/adrs.md).
i_overlay = { version = "=9.0.1", default-features = false }
# Pinned exactly (ADR 0020 §2): the text engine turns hostile font bytes into outlines that become
# cuts, inside a wasm module that cannot catch a panic. An update is a reviewed PR that reruns the
# text-core tests and the hostile-input property test. `harfrust` is MIT; `skrifa` MIT OR Apache-2.0.
harfrust = { version = "=0.14.0", default-features = false, features = ["std"] }
skrifa = { version = "=0.48.0", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
# Pinned exactly (`specs/0076-single-line-fonts/adrs.md` decision 2): the XML reader of SVG fonts,
# hostile input in wasm. MIT OR Apache-2.0, no dependencies, no `unsafe`, no I/O; already in
# `Cargo.lock` through `fontdb`. Without `positions`.
roxmltree = { version = "=0.20.0", default-features = false, features = ["std"] }
# The desktop font list (ADR 0020 §3): pure Rust, its own fontconfig reader, no C library.
# Pinned exactly as the spike measured it; MIT. Without `memmap` (no `unsafe` mmap in the tree).
fontdb = { version = "=0.24.0", default-features = false, features = ["std", "fs", "fontconfig"] }
# Grapheme clusters for the vertical run split (`specs/0079-text-layout-controls`, criterion 23):
# a mark never lands in another run than its base. MIT OR Apache-2.0, no dependencies, builds for
# wasm32; already in `Cargo.lock` through `tao` (desktop shell).
unicode-segmentation = { version = "1.13", default-features = false }
# Property tests (dev-dependency of the geometry, ui and text crates).
proptest = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"

# Debug builds and test binaries dominated the disk (70 to 90 GB of
# target/debug per worktree). Line tables keep backtraces and panics readable;
# dependencies carry no debug info at all. Remove these lines to step through
# code in a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
