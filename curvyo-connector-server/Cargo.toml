[package]
name = "curvyo-connector-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The machine connector program: runs next to the machine and serves the app over TLS (ADR 0035)."

[lints]
workspace = true

[dependencies]
curvyo-connector-io = { path = "../curvyo-connector-io", version = "0.1.0" }
curvyo-connector-core = { path = "../curvyo-connector-core", version = "0.1.0" }
anyhow = "1"
# The default state directory. MIT OR Apache-2.0; already locked through Tauri.
dirs = "7"
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# SIGINT and SIGTERM through a handler that only wakes the main thread (addendum C11): `serialport`
# waits in `ppoll` with an empty signal mask, so a blocked-and-`sigwait` design lets the default
# action kill the process. MIT OR Apache-2.0; its `signal-hook-registry` is already locked.
signal-hook = "0.4.6"

[dev-dependencies]
tempfile = "3"
uuid.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }
