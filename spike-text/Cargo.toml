[package]
name = "spike-text"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Throwaway spike for ADR 0020 (text engine). Never merged."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["engine", "rb"]
# Without `engine` the wasm build is the size baseline (wasm-bindgen only).
engine = ["dep:harfrust", "dep:skrifa"]
# Size probes: one library at a time, and the fallback pair.
hr-only = ["dep:harfrust"]
sk-only = ["dep:skrifa"]
rb = ["dep:rustybuzz", "dep:ttf-parser"]

[dependencies]
harfrust = { version = "=0.14.0", optional = true }
skrifa = { version = "=0.48.0", optional = true, default-features = false, features = ["std"] }
rustybuzz = { version = "=0.20.1", optional = true }
ttf-parser = { version = "=0.25.1", optional = true }
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fontdb = { version = "=0.24.0" }
