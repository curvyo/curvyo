[package]
name = "curvyo-text-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Curvyo text engine: turns a face's bytes, a string and a size into positioned glyph outlines and line metrics (pure, wasm-compatible)."

[lints]
workspace = true

[dependencies]
# The hostile-XML guard and the path data parser of SVG fonts (ADR 0018 §3).
curvyo-svg-core = { path = "../curvyo-svg-core", version = "0.1.0" }
harfrust.workspace = true
skrifa.workspace = true
sha2.workspace = true
kurbo.workspace = true
roxmltree.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
# Zip archives of fonts (`specs/0083-font-info-and-zip` adrs.md decision 1): the reader already
# in the workspace for the `.curvyo` container, deflate only.
zip.workspace = true

[dev-dependencies]
toml.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Hostile-input property test over mutated font files (spec criterion 32).
proptest.workspace = true
