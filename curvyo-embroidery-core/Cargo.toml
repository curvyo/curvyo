[package]
name = "curvyo-embroidery-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The embroidery extension (ADR 0097, `specs/0160-embroidery`): manifest, profiles, hoops, operations, the stitch plan and the DST writer and reader."

[lints]
workspace = true

[dependencies]
curvyo-extension-core = { path = "../curvyo-extension-core", version = "0.1.0" }
curvyo-document-core = { path = "../curvyo-document-core", version = "0.1.0" }
curvyo-geometry-core = { path = "../curvyo-geometry-core", version = "0.1.0" }
curvyo-inkstitch-core = { path = "../curvyo-inkstitch-core", version = "0.1.0" }
curvyo-library-core = { path = "../curvyo-library-core", version = "0.1.0" }
kurbo.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The golden files are also compared in the wasm build, in Node (`adrs.md` EM9); MIT OR
# Apache-2.0, already in the lock file through the laser's tests.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
