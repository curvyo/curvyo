[package]
name = "curvyo-storage-io"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Impure capabilities for the desktop client: atomic writes, path reads, the font list (ADR 0011, ADR 0020 §3)."

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
fontdb.workspace = true
# The text engine's SVG font reader decides what the folder lists and Add font accepts
# (`specs/0076-single-line-fonts` criteria 1, 3, 23); only its SVG-only entry point
# `svg_listable_faces` is called (`adrs.md` decision 5, architect note 2026-10-23).
curvyo-text-core = { path = "../curvyo-text-core", version = "0.1.0" }

[dev-dependencies]
# Only the test that opening an older project writes nothing to its file (`0040` criterion 4).
curvyo-document-core = { path = "../curvyo-document-core", version = "0.1.0" }
tempfile = "3"
# Builds archives for the font archive tests (`specs/0083-font-info-and-zip`).
zip.workspace = true
