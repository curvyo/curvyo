[package]
name = "curvyo-storage-io"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Impure capabilities for the desktop client: atomic writes, path reads, the font list, the credential store (ADR 0011, ADR 0020 §3, ADR 0031 decision 12)."

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
# `workspace.toml` and `recent-workspaces.toml` (`specs/0095-workspace` criteria 1, 20, 23).
serde.workspace = true
toml.workspace = true
# A shared workspace's `index.json` cache (`specs/0095-workspace`, ADR 0037 decision 1).
serde_json.workspace = true
fontdb.workspace = true
# The text engine's SVG font reader decides what the folder lists and Add font accepts
# (`specs/0076-single-line-fonts` criteria 1, 3, 23); only its SVG-only entry point
# `svg_listable_faces` is called (`adrs.md` decision 5, architect note 2026-10-23).
curvyo-text-core = { path = "../curvyo-text-core", version = "0.1.0" }
# The credential store of device and document keys (ADR 0007 §1, ADR 0031 decision 12): the OS
# keychain (Secret Service over libdbus, already linked by the Tauri shell; macOS Keychain; Windows
# Credential Manager), MIT OR Apache-2.0. Not `zbus`, which `cargo deny` flags.
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "apple-native", "windows-native"] }
# Its fallback, the encrypted key file under the maker's passphrase: Argon2id (RustCrypto, MIT OR
# Apache-2.0) derives the key, XChaCha20-Poly1305 (the cipher of ADR 0008 §2, already locked)
# seals the file, `getrandom` draws its salt and nonces (already locked).
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
getrandom = "0.4"
# Moves a deleted workspace document or folder to the OS trash, never erasing it
# (`specs/0095-workspace` criteria 17 and 40, ADR 0037 decision 13): MIT. On Linux it writes the
# freedesktop trash as files (no D-Bus stack); default features: `chrono` (already locked) dates the
# trash entry, `coinit_apartmentthreaded` initialises COM on Windows.
trash = "5.2"
# Reads a workspace document's `thumbnail.png` without opening the document, and puts the page's
# thumbnail into the container on save (`specs/0095-workspace` criteria 6 and 8): the workspace's
# own zip crate, already used by `curvyo-document-core`.
zip.workspace = true

[dev-dependencies]
# Only the test that opening an older project writes nothing to its file (`0040` criterion 4).
curvyo-document-core = { path = "../curvyo-document-core", version = "0.1.0" }
tempfile = "3"
# Thread CPU time of the workspace scan budget (`specs/0095-workspace` criterion 5).
rustix = { version = "1.1", features = ["time"] }
